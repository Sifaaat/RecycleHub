<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecycleHub | Contact</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Recycle<span>Hub</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="add-product.html">Sell</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li id="authLink"></li>
        </ul>
    </nav>
</header>

<section class="contact-section">
    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>We would love to hear from you.</p>

        <form id="contactForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Subject</label>
                <input type="text" id="subject" required>
            </div>

            <div class="input-group">
                <label>Message</label>
                <textarea id="message" rows="6" required></textarea>
            </div>

            <button class="register-btn" type="submit">Send Message</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 RecycleHub. All Rights Reserved.</p>
</footer>

<script src="js/api.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
